<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theo dõi té ngã</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>Theo dõi té ngã</h1>
      <p id="backend" role="status">Đang kết nối với máy xử lý…</p>
    </header>
    <nav aria-label="Chế độ" class="mode">
      <button data-mode="camera" aria-pressed="true">Camera</button>
      <button data-mode="upload" aria-pressed="false" hidden>Thử video</button>
      <button data-mode="replay" aria-pressed="false" hidden>Phát lại</button>
      <button data-mode="review" aria-pressed="false" hidden>Rà nhãn</button>
    </nav>
    <div class="layout">
      <section class="viewer" aria-label="Hình ảnh theo dõi">
        <div id="stage" class="stage">
          <div class="placeholder" id="placeholder">Camera đang tắt</div>
          <video id="video" playsinline preload="metadata" hidden></video>
          <canvas id="skeleton" aria-hidden="true"></canvas>
        </div>
        <div id="camera-actions" class="controls">
          <button class="primary" id="start" disabled>Bắt đầu theo dõi</button>
          <button id="stop" disabled>Dừng</button>
          <button id="flip" disabled>Đổi camera</button>
          <label class="tick"><input type="checkbox" id="show-bones" checked> Hiện khung xương</label>
        </div>
        <form id="upload-actions" class="controls" hidden>
          <label for="upload-file">Chọn video</label>
          <input id="upload-file" type="file" accept=".mp4,.webm" required>
          <button id="analyze" class="primary" type="submit" disabled>Phân tích video</button>
          <p id="upload-limit" class="hint"></p>
        </form>
        <div id="video-actions" class="controls" hidden>
          <label for="clip">Video gốc</label>
          <select id="clip"></select>
          <label for="speed">Tốc độ</label>
          <select id="speed">
            <option value="0.25">0,25×</option>
            <option value="0.5">0,5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1,5×</option>
          </select>
        </div>
        <a id="original" class="original" hidden>Tải video gốc</a>
        <p id="message" class="message" role="status" hidden></p>
      </section>
      <aside>
        <section id="session-panel" aria-label="Trạng thái phiên">
          <dl>
            <dt>Trạng thái</dt>
            <dd id="state" class="state" aria-live="polite">Đang chờ</dd>
            <dt id="posture-label" hidden>Tư thế</dt>
            <dd id="posture-value" hidden></dd>
            <dt>Thời gian phiên</dt>
            <dd id="timer" class="timer">00:00</dd>
          </dl>
          <div class="events">
            <h2>Sự kiện</h2>
            <p id="upload-result" class="upload-result" role="status" hidden></p>
            <p id="upload-source" hidden>File trùng với một video trong tập train té ngã.</p>
            <p id="empty-events">Chưa có cảnh báo trong phiên.</p>
            <ol id="event-list"></ol>
          </div>
        </section>
        <form id="annotation" hidden>
          <h2>Xác nhận nhãn</h2>
          <p id="clip-label"></p>
          <label for="label">Nhãn đã quan sát</label>
          <select id="label">
            <option value="unknown">Không rõ</option>
            <option value="Fall">Fall · Có té ngã</option>
            <option value="No_Fall">No_Fall · Không té ngã</option>
          </select>
          <div id="fall-marks" hidden>
            <label for="onset">Mất thăng bằng (giây)</label>
            <div class="mark"><input id="onset" type="number" min="0" step="0.001"><button type="button" data-mark="onset">Lấy mốc hiện tại</button></div>
            <label for="impact">Chạm bề mặt thấp hơn (giây)</label>
            <div class="mark"><input id="impact" type="number" min="0" step="0.001"><button type="button" data-mark="impact">Lấy mốc hiện tại</button></div>
          </div>
          <div id="normal-marks" hidden>
            <p>Khoảng No_Fall đáng tin cậy</p>
            <div id="intervals"></div>
            <button type="button" id="add-interval">Thêm khoảng No_Fall</button>
          </div>
          <label for="note">Căn cứ quan sát</label>
          <textarea id="note" rows="3" maxlength="500" required></textarea>
          <button type="submit" class="primary" id="save">Lưu nhãn</button>
        </form>
      </aside>
    </div>
  </main>
  <template id="interval-template">
    <fieldset>
      <legend>Khoảng (giây)</legend>
      <div class="mark"><input class="begin" aria-label="Giây bắt đầu" type="number" min="0" step="0.001"><button type="button" class="mark-begin">Lấy mốc đầu</button></div>
      <div class="mark"><input class="end" aria-label="Giây kết thúc" type="number" min="0" step="0.001"><button type="button" class="mark-end">Lấy mốc cuối</button></div>
      <button type="button" class="remove-interval">Bỏ khoảng</button>
    </fieldset>
  </template>
</body>
</html>

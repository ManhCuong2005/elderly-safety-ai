publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: 3.12.1
  firebase_auth: 5.5.1
  cloud_firestore: 5.6.5
  firebase_messaging: 15.2.4
  flutter_local_notifications: 19.0.0
  shared_preferences: 2.5.2
  intl: 0.20.2
